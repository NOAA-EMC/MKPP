name: Publish CI Docker Image

on:
  push:
    branches: ["main", "develop", "feature/*", "feature/**"]
    paths:
      - '.github/docker/Dockerfile.ci'
      - 'environment.yml'
      - 'pyproject.toml'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    paths:
      - '.github/docker/Dockerfile.ci'
      - 'environment.yml'
      - 'pyproject.toml'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Personal namespace: the package is public, so CI jobs pull it anonymously.
  # The org GITHUB_TOKEN cannot write to a personal namespace, so merges
  # republish via the repo secret GHCR_PAT (a PAT owned by bbakernoaa with
  # write:packages).  Without that secret the workflow still builds (keeping
  # the Dockerfile validated) but skips the push.
  IMAGE_NAME: bbakernoaa/mkpp-ci-env
  IMAGE_USER: bbakernoaa

jobs:
  build-and-push:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect push capability
        id: canpush
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [ -n "$GHCR_PAT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GHCR_PAT secret not set; image will be built but NOT pushed"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        # A PAT owned by the image owner is required: the org GITHUB_TOKEN
        # cannot write to a personal namespace.  Without it the build still
        # validates the Dockerfile and the push is skipped.
        if: steps.canpush.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.IMAGE_USER }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/docker/Dockerfile.ci
          push: ${{ github.event_name != 'pull_request' && steps.canpush.outputs.enabled == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
